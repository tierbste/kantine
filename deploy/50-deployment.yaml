# Ein Pod, der den Speiseplan alle REFRESH_SECONDS abholt und unter
# :9100/metrics anbietet. Kein eigenes Image: das Skript (nur
# Standardbibliothek) kommt per ConfigMap ins distroless-Python-Image.
#
# Image und securityContext laufen unveraendert auf Kubernetes UND OpenShift:
# distroless :nonroot hat einen numerischen User (65532), damit greift
# runAsNonRoot ohne runAsUser. Ein festes runAsUser waere unter OpenShifts
# SCC restricted-v2 verboten - dort vergibt OpenShift die UID selbst.
#
# Der Speiseplan liegt nur im Speicher - nach einem Neustart wird neu geholt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kantine
  labels:
    app.kubernetes.io/name: kantine
spec:
  replicas: 1
  # Nie zwei Abrufer gleichzeitig.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kantine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kantine
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kantine
          # Python 3.13, per Digest gepinnt. Ohne Zugriff auf gcr.io: Image ins
          # eigene Registry spiegeln und hier (oder per kustomize images:) ersetzen.
          image: gcr.io/distroless/python3-debian13:nonroot@sha256:64e54c4b1200da244d80181d98e86fc01d73c8101f107d5baf472152d8e119a2
          # Entrypoint des Images ist python3.13, hier nur die Argumente.
          args: ["-u", "-B", "/app/kantine.py"]
          envFrom:
            - configMapRef:
                name: kantine-config
            # KANTINE_PIN - von Hand angelegt, nicht im Repo (siehe README).
            - secretRef:
                name: kantine
          ports:
            - name: metrics
              containerPort: 9100
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: kantine-script
