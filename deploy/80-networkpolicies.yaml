# Netzwerk-Segmentierung: eingehend alles dicht, nur Prometheus darf
# /metrics (Port 9100) scrapen. Ausgehender Verkehr bleibt frei
# (qnips-API, Firebase, Firestore).
#
# Erlaubte Prometheus-Namespaces: 'monitoring' (kube-prometheus) und die
# beiden von OpenShift (User Workload Monitoring scrapt aus
# openshift-user-workload-monitoring). Laeuft Prometheus woanders: ergaenzen.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - monitoring
                  - openshift-monitoring
                  - openshift-user-workload-monitoring
      ports:
        - port: 9100
